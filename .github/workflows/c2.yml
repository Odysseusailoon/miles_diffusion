name: c2

on:
  push:
    branches: [probe-rx-ir]

permissions:
  contents: write

jobs:
  exec:
    runs-on: self-hosted
    steps:
      - name: Fix workspace ownership
        run: docker run --rm -v "${{ github.workspace }}:/ws" alpine:3 chown -R "$(id -u):$(id -g)" /ws
      - uses: actions/checkout@v4
        with:
          ref: probe-rx-ir
      - name: Execute command batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash c2-run.sh
